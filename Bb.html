<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zingoo CRM Pro - Enterprise Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        .hidden { display: none !important; }
        
        /* Status Borders */
        .border-hot { border-left: 6px solid #ef4444 !important; }
        .border-warm { border-left: 6px solid #f59e0b !important; } /* Warm = Orange/Amber */
        .border-cold { border-left: 6px solid #22c55e !important; } /* Cold = Green */
        .border-therapist { border-left: 6px solid #8b5cf6 !important; } /* Therapist Default */
        .border-other { border-left: 6px solid #64748b !important; } /* Other Default */
        
        /* Status Badges Full Color */
        .badge-hot { background-color: #ef4444; color: white; }
        .badge-warm { background-color: #f59e0b; color: white; }
        .badge-cold { background-color: #22c55e; color: white; }
        .badge-therapist { background-color: #8b5cf6; color: white; }
        .badge-other { background-color: #64748b; color: white; }

        .active-cat { background-color: #312e81 !important; color: white !important; border-color: #312e81 !important; }
        .loader { border-top-color: #4f46e5; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Custom Scrollbar for compact lists */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-10 font-sans text-gray-800">

    <!-- Header -->
    <header class="bg-indigo-900 text-white p-4 shadow-lg sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-black tracking-widest uppercase flex items-center gap-2">
            <span class="bg-indigo-600 px-2 py-1 rounded text-white">Z</span> ZINGOO CRM
        </h1>
        <div class="text-xs font-bold text-indigo-300" id="total-count">0 Records</div>
    </header>

    <!-- Main Navigation -->
    <div id="nav-menu" class="p-4 max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
        <div onclick="prepareAddForm()" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center justify-center hover:shadow-md cursor-pointer transition-all">
            <div class="text-5xl mb-4 bg-indigo-50 p-4 rounded-full">📤</div>
            <span class="text-lg font-black text-indigo-900 uppercase tracking-widest">Add New Record</span>
            <p class="text-xs text-gray-400 mt-2 text-center">Create a new entry for Client, Therapist or Other</p>
        </div>
        <div onclick="openSection('view-sec'); refreshData();" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center justify-center hover:shadow-md cursor-pointer transition-all">
            <div class="text-5xl mb-4 bg-emerald-50 p-4 rounded-full">📊</div>
            <span class="text-lg font-black text-emerald-900 uppercase tracking-widest">CRM Database</span>
            <p class="text-xs text-gray-400 mt-2 text-center">View, filter, edit and manage all entries</p>
        </div>
    </div>

    <!-- Add / Edit Section -->
    <section id="upload-sec" class="hidden p-4 max-w-2xl mx-auto mt-2">
        <button onclick="openSection('nav-menu')" class="mb-4 flex items-center font-bold text-indigo-700 bg-indigo-50 px-4 py-2 rounded-lg hover:bg-indigo-100 transition-colors"> 
            <span class="mr-2">←</span> Back to Dashboard
        </button>
        
        <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-200">
            <h2 id="form-title" class="text-xl font-black mb-6 text-gray-800 border-b pb-3 uppercase">Add New Entry</h2>
            
            <!-- Type Selection -->
            <div class="flex gap-2 mb-6">
                <button id="btn-client" onclick="setType('client')" class="flex-1 py-3 rounded-lg border border-gray-300 font-bold text-sm tracking-wide active-cat transition-colors">CLIENT</button>
                <button id="btn-therapist" onclick="setType('therapist')" class="flex-1 py-3 rounded-lg border border-gray-300 font-bold text-sm tracking-wide transition-colors">THERAPIST</button>
                <button id="btn-other" onclick="setType('other')" class="flex-1 py-3 rounded-lg border border-gray-300 font-bold text-sm tracking-wide transition-colors">OTHER</button>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="text-xs font-bold text-gray-500 ml-1 uppercase tracking-wider">Full Name *</label>
                    <input type="text" id="name" placeholder="Enter Full Name" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg outline-none focus:ring-2 ring-indigo-500 transition-all">
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-500 ml-1 uppercase tracking-wider">Phone Number *</label>
                    <input type="tel" id="phone" placeholder="Paste Number Here (any format)" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg outline-none focus:ring-2 ring-indigo-500 transition-all">
                </div>
                
                <div>
                    <label class="text-xs font-bold text-gray-500 ml-1 uppercase tracking-wider">Location *</label>
                    <select id="loc-select" onchange="toggleNewLoc(this.value)" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg outline-none mb-2 focus:ring-2 ring-indigo-500 transition-all">
                        <option value="">Select Location</option>
                        <option value="NEW_CITY">+ Add New City</option>
                    </select>
                    <input type="text" id="custom-city" placeholder="Type City Name" class="hidden w-full p-3 bg-blue-50 border-2 border-blue-300 rounded-lg outline-none text-blue-900 font-bold">
                </div>

                <!-- Client Only: Lead Status -->
                <div id="status-container">
                    <label class="text-xs font-bold text-gray-500 ml-1 uppercase tracking-wider">Client Lead Status *</label>
                    <div class="flex gap-2 mt-1">
                        <label class="flex-1">
                            <input type="radio" name="status" value="hot" class="hidden peer" checked>
                            <div class="peer-checked:bg-red-500 peer-checked:text-white bg-red-50 text-red-700 border border-red-200 p-2 text-sm text-center rounded-lg font-black cursor-pointer transition-all">HOT 🔴</div>
                        </label>
                        <label class="flex-1">
                            <input type="radio" name="status" value="warm" class="hidden peer">
                            <div class="peer-checked:bg-amber-500 peer-checked:text-white bg-amber-50 text-amber-700 border border-amber-200 p-2 text-sm text-center rounded-lg font-black cursor-pointer transition-all">WARM 🟠</div>
                        </label>
                        <label class="flex-1">
                            <input type="radio" name="status" value="cold" class="hidden peer">
                            <div class="peer-checked:bg-green-500 peer-checked:text-white bg-green-50 text-green-700 border border-green-200 p-2 text-sm text-center rounded-lg font-black cursor-pointer transition-all">COLD 🟢</div>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-500 ml-1 uppercase tracking-wider">Follow-up / Reminder Date</label>
                    <input type="date" id="f-date" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg outline-none focus:ring-2 ring-indigo-500 transition-all">
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-500 ml-1 uppercase tracking-wider">Profile Image</label>
                    <p id="edit-img-notice" class="text-xs text-orange-600 font-bold hidden mb-1">Leave empty to keep existing image</p>
                    <input type="file" id="img-input" accept="image/*" class="w-full text-sm mt-1 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-bold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200 cursor-pointer">
                </div>

                <!-- Custom Fields -->
                <div>
                    <label class="text-xs font-bold text-gray-500 ml-1 uppercase tracking-wider">Additional Data</label>
                    <div id="extra-container" class="space-y-2 mt-1"></div>
                    <button onclick="addNewField()" class="w-full mt-2 py-2 border border-dashed border-gray-400 text-gray-600 hover:bg-gray-50 rounded-lg font-bold text-sm transition-all">+ Add Extra Field</button>
                </div>

                <button onclick="handleUpload()" id="save-btn" class="w-full bg-indigo-700 hover:bg-indigo-800 text-white p-4 rounded-xl font-black text-lg shadow-md transition-all mt-4">SAVE TO CLOUD DATABASE</button>
            </div>
        </div>
    </section>

    <!-- View Section -->
    <section id="view-sec" class="hidden p-3 md:p-6 max-w-7xl mx-auto">
        <button onclick="openSection('nav-menu')" class="mb-4 flex items-center font-bold text-indigo-700 bg-indigo-50 px-4 py-2 rounded-lg hover:bg-indigo-100 transition-colors w-fit">
            <span class="mr-2">←</span> Back to Dashboard
        </button>
        
        <!-- Smart Filters -->
        <div class="bg-white p-4 rounded-xl shadow-md mb-6 border border-gray-200">
            <div class="flex flex-col md:flex-row gap-3">
                <select id="filt-type" onchange="handleFilterChange()" class="flex-1 p-2.5 bg-gray-50 border border-gray-300 rounded-lg font-bold text-sm outline-none focus:border-indigo-500">
                    <option value="all">All Types</option>
                    <option value="client">Clients Only</option>
                    <option value="therapist">Therapists Only</option>
                    <option value="other">Others Only</option>
                </select>
                
                <select id="filt-status" onchange="refreshData()" class="flex-1 p-2.5 bg-gray-50 border border-gray-300 rounded-lg font-bold text-sm outline-none focus:border-indigo-500">
                    <option value="all">All Lead Status</option>
                    <option value="hot">🔴 Hot Leads</option>
                    <option value="warm">🟠 Warm Leads</option>
                    <option value="cold">🟢 Cold Leads</option>
                </select>

                <button id="filt-today-btn" onclick="toggleTodayFilter()" class="flex-none p-2.5 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-lg font-bold text-sm outline-none hover:bg-indigo-100 transition-all whitespace-nowrap">
                    📅 Today
                </button>

                <select id="filt-loc" onchange="refreshData()" class="flex-1 p-2.5 bg-gray-50 border border-gray-300 rounded-lg font-bold text-sm outline-none focus:border-indigo-500">
                    <option value="all">All Locations</option>
                </select>
                
                <input type="text" id="search-box" oninput="refreshData()" placeholder="🔍 Search Name or Phone..." class="flex-[2] p-2.5 bg-gray-50 border border-gray-300 rounded-lg font-medium text-sm outline-none focus:border-indigo-500">
            </div>
        </div>

        <!-- Data List Container - Highly Compact -->
        <div id="data-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3"></div>
    </section>

    <!-- Detailed Modal -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-gray-900/95 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 relative shadow-2xl max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-gray-100 hover:bg-gray-200 text-gray-800 p-2 rounded-full font-bold text-xs transition-colors">✕ CLOSE</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyD9dd-bAdi-bXicIUp4THO0VGExzPn3FsI",
            authDomain: "zingoo-ae309.firebaseapp.com",
            databaseURL: "https://zingoo-ae309-default-rtdb.firebaseio.com",
            projectId: "zingoo-ae309",
            storageBucket: "zingoo-ae309.firebasestorage.app",
            messagingSenderId: "276852537232",
            appId: "1:276852537232:web:6b345eb808a5afa1b4e515"
        };
        const IMGBB_API_KEY = "dd62e4b97882cd9c85b233056f6171e9";

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentType = "client";
        let currentEditId = null; 
        let allLeadsData = {}; 
        let showTodayOnly = false; // For the new Today filter

        // --- UTILITY FUNCTIONS ---
        
        // ULTIMATE WHATSAPP NUMBER FIXER
        function getCleanWA(phone) {
            if(!phone) return "";
            let p = phone.toString().replace(/\D/g, ''); 
            if(p.startsWith('0') && p.length === 11) p = p.substring(1); 
            if(p.length === 10) p = "91" + p; 
            return p;
        }

        // AUTO-GENERATED WHATSAPP MESSAGE WITH NEW DETAILED FORMAT
        function getWaMessageLink(phone, name, type, location) {
            let cleanWA = getCleanWA(phone);
            if(!cleanWA) return "#";
            
            // Replaced 'Sir/Ma'am' with just 'Sir' as requested.
            let safeName = (name && name !== 'undefined') ? name.toUpperCase() : "Sir";
            
            // This is your requested image link
            let aarohnaImage = "https://i.ibb.co/4ZVcxRNG/815b4637-8bf9-4cdf-b85b-54ae9400104a.png";
            
            // Updated Long Professional Message
            let message = `Namaste ${safeName} 🙏\n\nSir, aapne hamari "Aarohna" ki is Ads par click kiya tha aur hamare Spa me services ke liye apply kiya tha.\n\nHume aapki inquiry prapt ho gayi hai. Neeche diya gaya image wahi Ads ka hai jis par aapne click kiya tha, kripya ek baar check kar lein:\n\n🖼️ ${aarohnaImage}\n\nHum aapko sabse best Spa services provide karna chahte hain. Kripya is message ka reply karein taaki hum aapki requirement ko samajh kar aapko aage ki details aur bookings provide kar sakein.\n\nAapke reply ka intezaar rahega. Apna dhyan rakhein, Dhanyawad! ✨`;
            
            return `https://wa.me/${cleanWA}?text=${encodeURIComponent(message)}`;
        }

        // TIMER COUNTER CALCULATION
        function getCountdown(dateString) {
            if(!dateString) return "";
            const target = new Date(dateString);
            target.setHours(23, 59, 59, 999);
            const now = new Date();
            const diffTime = target - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays > 1) return `<span class="text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded border border-blue-200 text-[10px] font-bold">⏳ In ${diffDays} days</span>`;
            if (diffDays === 1) return `<span class="text-orange-600 bg-orange-50 px-1.5 py-0.5 rounded border border-orange-200 text-[10px] font-bold">⏳ Tomorrow</span>`;
            if (diffDays === 0) return `<span class="text-green-600 bg-green-50 px-1.5 py-0.5 rounded border border-green-200 text-[10px] font-bold animate-pulse">🔥 TODAY!</span>`;
            
            return `<span class="text-red-600 bg-red-50 px-1.5 py-0.5 rounded border border-red-200 text-[10px] font-bold">⚠️ Overdue ${Math.abs(diffDays)}d</span>`;
        }

        // Form Type Management (Hides Status for Therapist & Other)
        function setType(type) {
            currentType = type;
            document.getElementById('btn-client').classList.toggle('active-cat', type === 'client');
            document.getElementById('btn-therapist').classList.toggle('active-cat', type === 'therapist');
            document.getElementById('btn-other').classList.toggle('active-cat', type === 'other');
            
            const statusBox = document.getElementById('status-container');
            if (type === 'client') {
                statusBox.classList.remove('hidden');
            } else {
                statusBox.classList.add('hidden');
            }
        }

        // View Filter Management (Hides Status filter for Non-Clients)
        function handleFilterChange() {
            const fType = document.getElementById('filt-type').value;
            const fStatus = document.getElementById('filt-status');
            if (fType !== 'client' && fType !== 'all') {
                fStatus.classList.add('hidden');
                fStatus.value = 'all'; 
            } else {
                fStatus.classList.remove('hidden');
            }
            refreshData();
        }

        function toggleTodayFilter() {
            showTodayOnly = !showTodayOnly;
            const btn = document.getElementById('filt-today-btn');
            if (showTodayOnly) {
                btn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-700');
                btn.classList.remove('bg-indigo-50', 'text-indigo-700', 'border-indigo-200');
            } else {
                btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-700');
                btn.classList.add('bg-indigo-50', 'text-indigo-700', 'border-indigo-200');
            }
            refreshData();
        }

        function openSection(id) {
            document.querySelectorAll('section, #nav-menu').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if(id === 'upload-sec') syncLocations();
        }

        function toggleNewLoc(val) {
            document.getElementById('custom-city').classList.toggle('hidden', val !== 'NEW_CITY');
        }

        function addNewField(key = "", value = "") {
            const cont = document.getElementById('extra-container');
            const div = document.createElement('div');
            div.className = "flex gap-2";
            div.innerHTML = `<input type="text" placeholder="Field Name" value="${key}" class="w-1/3 p-2 bg-gray-50 border border-gray-300 rounded-lg text-sm extra-k outline-none focus:border-indigo-500"><input type="text" placeholder="Value" value="${value}" class="w-2/3 p-2 bg-gray-50 border border-gray-300 rounded-lg text-sm extra-v outline-none focus:border-indigo-500">`;
            cont.appendChild(div);
        }

        function resetForm() {
            currentEditId = null;
            setType('client');
            document.getElementById('name').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('loc-select').value = '';
            document.getElementById('custom-city').value = '';
            document.getElementById('custom-city').classList.add('hidden');
            document.querySelector('input[name="status"][value="hot"]').checked = true;
            document.getElementById('f-date').value = '';
            document.getElementById('img-input').value = '';
            document.getElementById('extra-container').innerHTML = '';
            document.getElementById('form-title').innerText = "ADD NEW ENTRY";
            document.getElementById('save-btn').innerText = "SAVE TO CLOUD DATABASE";
            document.getElementById('edit-img-notice').classList.add('hidden');
        }

        function prepareAddForm() {
            resetForm();
            openSection('upload-sec');
        }

        // --- IMAGE UPLOAD ---
        async function uploadToImgBB(file) {
            const formData = new FormData();
            formData.append("image", file);
            try {
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();
                return data.data.url;
            } catch (e) {
                console.error("ImgBB Error", e);
                return "";
            }
        }

        // --- FIREBASE OPERATIONS ---
        async function handleUpload() {
            const btn = document.getElementById('save-btn');
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const follow = document.getElementById('f-date').value;
            const file = document.getElementById('img-input').files[0];

            if(!name || !phone) return alert("Warning: Name aur Phone zaroori hai!");

            // Duplicate Number Checker logic before saving
            const cleanInputPhone = getCleanWA(phone);
            if (cleanInputPhone) {
                let isDuplicate = false;
                if (allLeadsData) {
                    for (let key in allLeadsData) {
                        if (currentEditId && key === currentEditId) continue; // Skip existing record during update
                        let existingPhone = getCleanWA(allLeadsData[key].phone || "");
                        if (existingPhone === cleanInputPhone) {
                            isDuplicate = true;
                            break;
                        }
                    }
                }
                if (isDuplicate) {
                    return alert("⚠ Yeh number pehle se exist krta hai! (This number is already saved)");
                }
            }
            
            let status = "";
            if (currentType === 'client') {
                const checkedStatus = document.querySelector('input[name="status"]:checked');
                status = checkedStatus ? checkedStatus.value : 'cold';
            }

            let city = document.getElementById('loc-select').value;
            if(city === 'NEW_CITY') city = document.getElementById('custom-city').value.trim();

            if(!city) return alert("Warning: Location zaroori hai!");

            btn.innerText = "⏳ PROCESSING DATA...";
            btn.disabled = true;

            let finalImgUrl = "";
            
            if (currentEditId && allLeadsData[currentEditId]) {
                finalImgUrl = allLeadsData[currentEditId].imageUrl || "";
            }

            if(file) {
                btn.innerText = "⏳ UPLOADING IMAGE...";
                const newUrl = await uploadToImgBB(file);
                if (newUrl) finalImgUrl = newUrl;
            }

            const extras = {};
            const keys = document.querySelectorAll('.extra-k');
            const vals = document.querySelectorAll('.extra-v');
            keys.forEach((k, i) => { 
                if(k.value.trim()) extras[k.value.trim()] = vals[i].value.trim(); 
            });

            const dataObj = {
                type: currentType,
                name, phone, location: city, status, followUp: follow,
                imageUrl: finalImgUrl,
                extras,
                timestamp: currentEditId ? (allLeadsData[currentEditId].timestamp || Date.now()) : Date.now()
            };

            if (currentEditId) {
                db.ref('leads/' + currentEditId).update(dataObj).then(() => {
                    alert("Record Updated Successfully!");
                    resetForm();
                    openSection('view-sec');
                    refreshData();
                }).catch(e => alert("Update Error: " + e.message)).finally(() => { btn.disabled = false; });
            } else {
                db.ref('leads').push(dataObj).then(() => {
                    alert("New Record Saved Successfully!");
                    resetForm();
                    openSection('view-sec');
                    refreshData();
                }).catch(e => alert("Save Error: " + e.message)).finally(() => { btn.disabled = false; });
            }
        }

        function syncLocations() {
            db.ref('leads').on('value', snap => {
                const data = snap.val();
                const sel = document.getElementById('loc-select');
                const filt = document.getElementById('filt-loc');
                const cities = new Set();
                
                if(data) {
                    Object.values(data).forEach(i => {
                        if(i.location) cities.add(i.location);
                    });
                }

                const currentSel = sel.value;
                const currentFilt = filt.value;

                sel.innerHTML = '<option value="">Select Location</option><option value="NEW_CITY">+ Add New City</option>';
                filt.innerHTML = '<option value="all">All Locations</option>';
                
                Array.from(cities).sort().forEach(c => {
                    sel.innerHTML += `<option value="${c}">${c}</option>`;
                    filt.innerHTML += `<option value="${c}">${c}</option>`;
                });

                if(currentSel && cities.has(currentSel)) sel.value = currentSel;
                if(currentFilt && cities.has(currentFilt)) filt.value = currentFilt;
            });
        }

        function refreshData() {
            const list = document.getElementById('data-list');
            const fType = document.getElementById('filt-type').value;
            const fStatus = document.getElementById('filt-status').value;
            const fLoc = document.getElementById('filt-loc').value;
            const sText = document.getElementById('search-box').value.toLowerCase();

            list.innerHTML = '<div class="col-span-full flex justify-center p-10"><div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-10 w-10"></div></div>';

            db.ref('leads').on('value', snap => {
                list.innerHTML = "";
                const data = snap.val();
                
                if(!data) {
                    document.getElementById('total-count').innerText = "0 Records";
                    return list.innerHTML = "<p class='col-span-full text-center text-gray-500 mt-10 font-bold'>No Records Found.</p>";
                }

                allLeadsData = data; 
                const keys = Object.keys(data).reverse();
                let displayCount = 0;

                keys.forEach(id => {
                    const item = data[id];
                    
                    if (item.status === 'junk') item.status = 'cold'; 
                    let safeStatus = item.status || 'cold';
                    let isClient = (item.type === 'client');
                    let isOther = (item.type === 'other');

                    if(fType !== 'all' && item.type !== fType) return;
                    if(fLoc !== 'all' && item.location !== fLoc) return;
                    if(isClient && fStatus !== 'all' && safeStatus !== fStatus) return; 
                    if(sText && !(
                        (item.name && item.name.toLowerCase().includes(sText)) || 
                        (item.phone && item.phone.includes(sText))
                    )) return;

                    // Today Filter Logic
                    if (showTodayOnly) {
                        if (!item.followUp) return;
                        const target = new Date(item.followUp);
                        target.setHours(23, 59, 59, 999);
                        const now = new Date();
                        const diffTime = target - now;
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        if (diffDays !== 0) return; // Discard if not exactly today
                    }

                    displayCount++;

                    let borderClass = 'border-therapist';
                    let badgeClass = 'badge-therapist';
                    let badgeText = 'Therapist';

                    if (isClient) {
                        borderClass = `border-${safeStatus}`;
                        badgeClass = `badge-${safeStatus}`;
                        badgeText = safeStatus;
                    } else if (isOther) {
                        borderClass = 'border-other';
                        badgeClass = 'badge-other';
                        badgeText = 'Other';
                    }

                    // Using our new Advanced Message generator here!
                    let waLinkWithMsg = getWaMessageLink(item.phone, item.name, item.type, item.location);

                    const timerTag = item.followUp ? getCountdown(item.followUp) : '';
                    
                    const card = document.createElement('div');
                    card.className = `bg-white p-3 rounded shadow-sm border border-gray-100 ${borderClass} flex justify-between items-center hover:bg-gray-50 transition-colors cursor-pointer group`;
                    
                    card.innerHTML = `
                        <div onclick="openDetail('${id}')" class="flex-1 min-w-0 pr-2">
                            <div class="flex items-center gap-2 mb-1">
                                <h3 class="font-bold text-gray-800 text-sm truncate uppercase tracking-tight">${item.name || 'N/A'}</h3>
                                ${timerTag}
                            </div>
                            <div class="flex items-center gap-1.5 mt-1">
                                <span class="px-2 py-[2px] text-[9px] rounded-sm font-black uppercase tracking-wider ${badgeClass}">${badgeText}</span>
                                <span class="text-[11px] font-semibold text-gray-500 truncate uppercase">• ${item.location || 'N/A'}</span>
                            </div>
                        </div>
                        <div class="flex gap-1.5 ml-1 shrink-0">
                            <a href="tel:${item.phone || ''}" class="bg-indigo-100 hover:bg-indigo-600 hover:text-white text-indigo-700 p-2.5 rounded transition-colors" title="Call">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"></path></svg>
                            </a>
                            <a href="${waLinkWithMsg}" target="_blank" class="bg-emerald-100 hover:bg-emerald-600 hover:text-white text-emerald-700 p-2.5 rounded transition-colors" title="WhatsApp">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824zm-3.423-14.416c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm.029 18.88c-1.161 0-2.305-.292-3.318-.844l-3.677.964.984-3.595c-.607-1.052-.927-2.246-.926-3.468.001-5.824 4.74-10.563 10.564-10.563 5.826 0 10.564 4.741 10.564 10.564 0 5.822-4.74 10.563-10.564 10.563z"/></svg>
                            </a>
                        </div>
                    `;
                    list.appendChild(card);
                });

                document.getElementById('total-count').innerText = `${displayCount} Records`;
            });
        }

        function openDetail(id) {
            const item = allLeadsData[id];
            if(!item) return;

            let extraHTML = "";
            if(item.extras && Object.keys(item.extras).length > 0) {
                extraHTML += `<div class="mt-4"><h4 class="text-[10px] font-black uppercase text-gray-400 mb-2 tracking-widest border-b pb-1">Additional Information</h4><div class="space-y-2">`;
                Object.keys(item.extras).forEach(k => {
                    extraHTML += `<div class="flex justify-between items-center text-sm bg-gray-50 p-2 rounded">
                        <span class="text-gray-500 font-bold capitalize">${k || 'N/A'}</span>
                        <span class="font-black text-gray-800 text-right">${item.extras[k] || 'N/A'}</span>
                    </div>`;
                });
                extraHTML += `</div></div>`;
            }

            let isClient = (item.type === 'client');
            let isOther = (item.type === 'other');
            let safeStatus = item.status === 'junk' ? 'cold' : (item.status || 'cold');

            let badgeClass = 'badge-therapist';
            let badgeText = 'THERAPIST PROFILE';
            if (isClient) {
                badgeClass = `badge-${safeStatus}`;
                badgeText = `${safeStatus} LEAD`;
            } else if (isOther) {
                badgeClass = 'badge-other';
                badgeText = 'OTHER ENTRY';
            }
            
            // Generate Advanced Message here too
            let waLinkWithMsg = getWaMessageLink(item.phone, item.name, item.type, item.location);

            document.getElementById('modal-content').innerHTML = `
                <div class="text-center mb-5">
                    ${item.imageUrl ? `<img src="${item.imageUrl}" class="w-24 h-24 rounded-full mx-auto object-cover border-4 border-gray-100 shadow-md mb-3">` : `<div class="w-20 h-20 bg-indigo-100 rounded-full mx-auto mb-3 flex items-center justify-center text-3xl font-black text-indigo-500 border-2 border-indigo-200">${(item.name || 'U')[0].toUpperCase()}</div>`}
                    <h2 class="text-2xl font-black text-gray-800 uppercase">${item.name || 'N/A'}</h2>
                    <div class="mt-2">
                        <span class="inline-block px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest ${badgeClass}">${badgeText}</span>
                    </div>
                </div>
                
                <div class="space-y-2 mb-6">
                    <div class="flex justify-between items-center p-2 border-b border-gray-100 text-sm"><span class="text-gray-400 font-bold uppercase text-[10px] tracking-wider">Phone</span><span class="font-black text-gray-800">${item.phone || 'N/A'}</span></div>
                    <div class="flex justify-between items-center p-2 border-b border-gray-100 text-sm"><span class="text-gray-400 font-bold uppercase text-[10px] tracking-wider">Location</span><span class="font-black text-gray-800 uppercase">${item.location || 'N/A'}</span></div>
                    <div class="flex justify-between items-center p-2 border-b border-gray-100 text-sm"><span class="text-gray-400 font-bold uppercase text-[10px] tracking-wider">Category</span><span class="font-black text-gray-800 uppercase">${item.type || 'N/A'}</span></div>
                    ${item.followUp ? `<div class="flex justify-between items-center p-2 border-b border-gray-100 text-sm"><span class="text-gray-400 font-bold uppercase text-[10px] tracking-wider">Timer</span><div class="flex flex-col items-end"><span class="font-bold text-gray-500 text-[10px]">${item.followUp}</span> ${getCountdown(item.followUp)}</div></div>` : ''}
                    ${extraHTML}
                </div>

                <div class="grid grid-cols-2 gap-3 mb-4">
                    <a href="tel:${item.phone || ''}" class="bg-indigo-600 hover:bg-indigo-700 text-white text-center py-3 rounded-lg font-black text-sm uppercase transition-colors shadow-sm flex items-center justify-center gap-2">📞 Dial Call</a>
                    <a href="${waLinkWithMsg}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white text-center py-3 rounded-lg font-black text-sm uppercase transition-colors shadow-sm flex items-center justify-center gap-2">💬 WhatsApp</a>
                </div>
                
                <div class="grid grid-cols-2 gap-3 border-t border-gray-100 pt-4 mt-2">
                    <button onclick="editRecord('${id}')" class="w-full py-2.5 text-blue-600 font-black text-xs uppercase tracking-widest bg-blue-50 hover:bg-blue-100 rounded-lg transition-colors border border-blue-200">✏️ Edit</button>
                    <button onclick="deleteRecord('${id}')" class="w-full py-2.5 text-red-600 font-black text-xs uppercase tracking-widest bg-red-50 hover:bg-red-100 rounded-lg transition-colors border border-red-200">🗑️ Delete</button>
                </div>
            `;
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        // --- EDIT FUNCTIONALITY ---
        function editRecord(id) {
            const item = allLeadsData[id];
            if(!item) return;

            currentEditId = id;
            setType(item.type || 'client');
            
            document.getElementById('name').value = item.name || '';
            document.getElementById('phone').value = item.phone || '';
            document.getElementById('f-date').value = item.followUp || '';
            
            const sel = document.getElementById('loc-select');
            let locFound = false;
            for(let i=0; i<sel.options.length; i++) {
                if(sel.options[i].value === item.location) { locFound = true; break; }
            }
            if(locFound) {
                sel.value = item.location;
                toggleNewLoc(item.location);
            } else if (item.location) {
                sel.value = 'NEW_CITY';
                toggleNewLoc('NEW_CITY');
                document.getElementById('custom-city').value = item.location;
            } else {
                sel.value = '';
            }

            if(item.type === 'client') {
                const radios = document.getElementsByName('status');
                const targetStatus = item.status === 'junk' ? 'cold' : (item.status || 'cold');
                for(let i=0; i<radios.length; i++){
                    if(radios[i].value === targetStatus) radios[i].checked = true;
                }
            }
            
            const cont = document.getElementById('extra-container');
            cont.innerHTML = '';
            if(item.extras) {
                Object.keys(item.extras).forEach(k => {
                    addNewField(k, item.extras[k]);
                });
            }

            document.getElementById('form-title').innerText = `EDIT ENTRY: ${(item.name || 'RECORD').toUpperCase()}`;
            document.getElementById('save-btn').innerText = "UPDATE CLOUD DATA";
            document.getElementById('edit-img-notice').classList.remove('hidden');

            closeModal();
            openSection('upload-sec');
        }

        function deleteRecord(id) {
            if(confirm("⚠ WARNING: Are you sure you want to permanently delete this record? This action cannot be undone.")) {
                db.ref('leads/' + id).remove().then(() => {
                    alert("Record Deleted Successfully!");
                    closeModal();
                }).catch(e => alert("Error deleting record: " + e.message));
            }
        }

        function closeModal() { document.getElementById('detail-modal').classList.add('hidden'); }
        
        // Initial setup
        syncLocations();
        handleFilterChange();
    </script>
</body>
</html>
