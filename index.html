<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe Spa - VIP Exclusive Access</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* === VARIABLES === */
        :root {
            --primary-gold: #D4AF37;
            --light-gold: #F3E5AB;
            --dark-bg: #050404;
            --panel-bg: rgba(15, 12, 10, 0.85);
            --text-light: #ffffff;
            --whatsapp-green: #25D366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* =========================================
           ANIMATION 1: Background Pan & Fade
           ANIMATION 2: Floating Glow on Icon
           ANIMATION 3: Glowing Pulse Button
           ANIMATION 4: Staggered Card Reveal
           ANIMATION 5: Glassmorphism Slide Up Transition
        ========================================== */

        @keyframes bgZoom {
            0% { background-size: 100%; }
            100% { background-size: 110%; }
        }

        @keyframes floatGlow {
            0% { transform: translateY(0px); text-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
            50% { transform: translateY(-10px); text-shadow: 0 0 25px rgba(212, 175, 55, 0.8); }
            100% { transform: translateY(0px); text-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideOutUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100vh); display: none; }
        }

        /* === GATEWAY SECTION (Form) === */
        #gateway-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Background animation applied here */
            background: linear-gradient(rgba(5, 4, 4, 0.8), rgba(5, 4, 4, 0.9)), 
                        url('https://images.unsplash.com/photo-1540555700478-4be289fbecef?q=80&w=2070&auto=format&fit=crop') center center fixed;
            background-size: cover;
            animation: bgZoom 20s infinite alternate linear;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }

        .gateway-header {
            text-align: center;
            margin-bottom: 30px;
            animation: slideUpFade 1s ease forwards;
        }

        .gateway-header i.fa-spa {
            font-size: 55px;
            color: var(--primary-gold);
            margin-bottom: 10px;
            /* Floating animation applied here */
            animation: floatGlow 4s infinite ease-in-out;
        }

        .gateway-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 45px;
            color: var(--primary-gold);
            letter-spacing: 6px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        /* Glassmorphism Premium Form */
        .gateway-form-container {
            background: rgba(15, 12, 10, 0.5);
            backdrop-filter: blur(15px); /* Frosted Glass Effect */
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 50px 40px;
            width: 100%;
            max-width: 480px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            animation: slideUpFade 1.2s ease forwards;
        }

        .gateway-form-container h2 {
            font-family: 'Cinzel', serif;
            color: var(--primary-gold);
            font-size: 20px;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        .gateway-form-container p {
            font-size: 13px;
            color: #d1d1d1;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--light-gold);
            margin-bottom: 8px;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .input-group input, 
        .input-group textarea {
            width: 100%;
            padding: 16px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: white;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            border-radius: 8px;
            transition: all 0.4s ease;
            font-size: 14px;
        }

        .input-group input:focus, 
        .input-group textarea:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            background: rgba(0, 0, 0, 0.9);
        }

        .btn-unlock {
            width: 100%;
            background: linear-gradient(135deg, #D4AF37, #AA771C);
            color: var(--dark-bg);
            border: none;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            /* Pulsing button animation */
            animation: pulseGlow 2s infinite;
        }

        .btn-unlock:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.5);
        }

        /* === MAIN VIP DASHBOARD SECTION (Hidden initially) === */
        #main-content-section {
            display: none; 
            min-height: 100vh;
        }

        .welcome-banner {
            text-align: center;
            padding: 80px 20px 60px;
            background: linear-gradient(to bottom, #14100E, var(--dark-bg));
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            animation: slideUpFade 1s ease forwards;
        }

        .welcome-banner h2 {
            font-family: 'Cinzel', serif;
            font-size: 38px;
            color: var(--primary-gold);
            margin-bottom: 10px;
            letter-spacing: 4px;
        }

        .welcome-banner p {
            font-family: 'Great Vibes', cursive;
            font-size: 35px;
            color: var(--light-gold);
            margin-top: -10px;
        }

        .providers-section {
            padding: 60px 10%;
        }

        .section-title {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: var(--primary-gold);
            margin-bottom: 50px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        /* === 3x3 GRID SYSTEM === */
        .providers-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 Columns exactly */
            gap: 40px;
        }

        .provider-card {
            background: var(--panel-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0; /* Hidden for staggered animation */
        }

        .provider-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.15);
            border-color: var(--primary-gold);
        }

        /* 1:1 Image Ratio */
        .image-container {
            width: 100%;
            aspect-ratio: 1 / 1; 
            overflow: hidden;
            border-radius: 50%; /* Made circular for ultra-premium look */
            border: 3px solid rgba(212, 175, 55, 0.5);
            margin-bottom: 25px;
            transition: all 0.5s ease;
        }

        .provider-card:hover .image-container {
            border-color: var(--primary-gold);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
        }

        .provider-card:hover .image-container img {
            transform: scale(1.15); /* Smooth zoom inside image */
        }

        .provider-card h3 {
            font-family: 'Cinzel', serif;
            color: var(--primary-gold);
            font-size: 22px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .provider-card p.address {
            font-size: 13px;
            color: #b3b3b3;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(37, 211, 102, 0.1);
            color: var(--whatsapp-green);
            border: 1px solid var(--whatsapp-green);
            padding: 14px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            transition: all 0.4s ease;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
        }

        .btn-whatsapp:hover {
            background-color: var(--whatsapp-green);
            color: white;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.5);
            transform: scale(1.05);
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .providers-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .providers-grid { grid-template-columns: 1fr; }
            .gateway-header h1 { font-size: 35px; }
            .gateway-form-container { padding: 40px 25px; }
        }
    </style>
</head>
<body>

    <!-- 1. VIP GATEWAY SECTION -->
    <section id="gateway-section">
        
        <div class="gateway-header">
            <i class="fa-solid fa-spa"></i>
            <h1>LUXE SPA</h1>
            <div style="font-family: 'Great Vibes', cursive; font-size: 40px; color: var(--light-gold);">VIP Experience</div>
        </div>

        <div class="gateway-form-container">
            <h2><i class="fa-solid fa-gem" style="margin-right: 8px;"></i> VIP VERIFICATION</h2>
            <p>Enter your credentials once to permanently unlock the VIP Dashboard on this device.</p>
            
            <form id="unlockForm">
                <div class="input-group">
                    <label>FULL NAME</label>
                    <input type="text" id="userName" placeholder="Enter your full name" required>
                </div>
                <div class="input-group">
                    <label>MOBILE / WHATSAPP NUMBER</label>
                    <input type="tel" id="userPhone" placeholder="Enter 10-digit number" required>
                </div>
                <div class="input-group">
                    <label>COMPLETE ADDRESS</label>
                    <textarea id="userAddress" rows="2" placeholder="Enter your service address" required></textarea>
                </div>
                
                <button type="submit" class="btn-unlock" id="unlockBtn">
                    UNLOCK ACCESS <i class="fa-solid fa-unlock-keyhole"></i>
                </button>
            </form>
        </div>

    </section>

    <!-- 2. MAIN VIP DASHBOARD SECTION -->
    <section id="main-content-section">
        
        <div class="welcome-banner">
            <h2>VIP DASHBOARD</h2>
            <p id="userWelcomeText">Exclusive Relaxation Awaits You</p>
        </div>

        <div class="providers-section">
            <h3 class="section-title"><i class="fa-solid fa-star" style="font-size:16px;"></i> OUR ELITE THERAPISTS <i class="fa-solid fa-star" style="font-size:16px;"></i></h3>
            
            <div class="providers-grid" id="userProvidersGrid">
                <!-- Fetching from Firebase -->
            </div>
        </div>

    </section>

    <!-- Firebase v9 SDK Connection Script -->
    <script type="module">
        // Uncompressed Firebase Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Your Exact Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC0oD7NKFbUweD58i1x6bheEBWfK7Yme9Q",
            authDomain: "mediverse-1088d.firebaseapp.com",
            projectId: "mediverse-1088d",
            storageBucket: "mediverse-1088d.firebasestorage.app",
            messagingSenderId: "691637264735",
            appId: "1:691637264735:web:56e8eba25de2f64378d6ea",
            measurementId: "G-DK3B7PGBXH"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const bookingsRef = ref(db, 'Client_Bookings');
        const providersRef = ref(db, 'Service_Providers');

        // ==========================================
        // FEATURE: LOCAL STORAGE ("Remember Me")
        // Check if user is already verified on page load
        // ==========================================
        window.onload = function() {
            const isVIP = localStorage.getItem('luxeSpa_isVIP');
            const savedName = localStorage.getItem('luxeSpa_UserName');

            if (isVIP === 'true' && savedName) {
                // Instantly hide gateway and show dashboard
                document.getElementById('gateway-section').style.display = 'none';
                document.getElementById('main-content-section').style.display = 'block';
                document.getElementById('userWelcomeText').innerText = `Welcome back, ${savedName}.`;
                loadProvidersData(); // Fetch the grid data
            }
        };

        // ==========================================
        // FORM SUBMIT: Save to Firebase & LocalStorage
        // ==========================================
        document.getElementById('unlockForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const btn = document.getElementById('unlockBtn');
            btn.innerHTML = 'VERIFYING... <i class="fa-solid fa-spinner fa-spin"></i>';

            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const address = document.getElementById('userAddress').value;

            // Save to Firebase
            const newBookingRef = push(bookingsRef);
            set(newBookingRef, {
                FullName: name,
                MobileNumber: phone,
                Address: address,
                Timestamp: new Date().toLocaleString()
            })
            .then(() => {
                // SUCCESS: Save in LocalStorage so user doesn't have to fill form again
                localStorage.setItem('luxeSpa_isVIP', 'true');
                localStorage.setItem('luxeSpa_UserName', name);

                // Play Slide Out Animation on Gateway
                const gateway = document.getElementById('gateway-section');
                gateway.style.animation = 'slideOutUp 1s ease forwards';
                
                setTimeout(() => {
                    gateway.style.display = 'none';
                    const mainContent = document.getElementById('main-content-section');
                    mainContent.style.display = 'block';
                    mainContent.style.animation = 'slideUpFade 1s ease forwards';
                    
                    document.getElementById('userWelcomeText').innerText = `Welcome, ${name}. Your Relaxation Awaits.`;
                    
                    loadProvidersData(); // Load the 3x3 Grid
                    window.scrollTo(0, 0);
                }, 900); // wait for animation to almost finish
            })
            .catch((error) => {
                alert("Database Error: " + error);
                btn.innerHTML = 'UNLOCK ACCESS <i class="fa-solid fa-unlock-keyhole"></i>';
            });
        });

        // ==========================================
        // FETCH DATA: Create 3x3 Grid with Staggered Animations
        // ==========================================
        function loadProvidersData() {
            onValue(providersRef, (snapshot) => {
                const gridContainer = document.getElementById('userProvidersGrid');
                gridContainer.innerHTML = ''; 

                if (snapshot.exists()) {
                    const providersData = snapshot.val();
                    let index = 0; // for staggered animation delay
                    
                    for (const key in providersData) {
                        const provider = providersData[key];
                        
                        // WhatsApp Link with pre-filled message
                        const cleanPhone = provider.WhatsAppNumber.replace(/\D/g,'');
                        const message = encodeURIComponent(`Hi ${provider.ProviderName}, I accessed your VIP profile. I want to book a spa session.`);
                        const waLink = `https://wa.me/91${cleanPhone}?text=${message}`;

                        // Creating Card HTML with inline animation delay based on index
                        const cardHTML = `
                            <div class="provider-card" style="animation: slideUpFade 0.8s ease forwards; animation-delay: ${index * 0.15}s;">
                                <div class="image-container">
                                    <img src="${provider.PhotoUrl}" alt="${provider.ProviderName}">
                                </div>
                                <h3>${provider.ProviderName}</h3>
                                <p class="address"><i class="fa-solid fa-location-arrow" style="color:var(--primary-gold)"></i> ${provider.Address}</p>
                                
                                <a href="${waLink}" target="_blank" class="btn-whatsapp">
                                    <i class="fa-brands fa-whatsapp fa-xl"></i> BOOK SESSION
                                </a>
                            </div>
                        `;
                        
                        gridContainer.innerHTML += cardHTML;
                        index++;
                    }
                } else {
                    gridContainer.innerHTML = `<p style="grid-column: span 3; text-align:center; color:#888; font-family:'Cinzel', serif;">VIP Therapists are currently unavailable. Check back soon.</p>`;
                }
            });
        }
    </script>
</body>
</html>
